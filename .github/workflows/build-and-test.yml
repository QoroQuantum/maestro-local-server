name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BOOST_VERSION: 1.90.0
  # Maestro commit this server is tested against. Update it together with
  # server changes that rely on newer native features; the native API tests
  # require its adjoint, mirror-observable (including mixed-state methods),
  # mixed-state overlap/fidelity and instruction-noise support, readout refusal
  # (including checkpoint prefixes), and whole-document result bound. Its
  # network_jobs test also passes on this 2-core runner.
  MAESTRO_REF: 0ef2937c5f791f9855717ea42e439c22bf9765b7
  # QRMI commit whose native integration suite exercises the full
  # QRMI -> server -> Maestro path. QRMI and Maestro are public, so this job
  # needs no stored credentials. Update it with QRMI's Maestro client changes.
  QRMI_REF: 278ae9e6a94cc84872f51fb173df255ebb16cd86

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maestro-local-server
        uses: actions/checkout@v5

      - name: Resolve Maestro checkout path
        id: paths
        run: |
          MAESTRO_DIR="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/maestro"
          echo "maestro_dir=$MAESTRO_DIR" >> "$GITHUB_OUTPUT"
          echo "boost_dir=boost_$(echo ${{ env.BOOST_VERSION }} | tr . _)" >> "$GITHUB_OUTPUT"

      # A pinned commit keeps CI reproducible: upstream Maestro changes cannot
      # break or silently change this build until MAESTRO_REF is updated.
      - name: Checkout Maestro C++ library
        env:
          MAESTRO_DIR: ${{ steps.paths.outputs.maestro_dir }}
        run: |
          git init -q "$MAESTRO_DIR"
          git -C "$MAESTRO_DIR" remote add origin https://github.com/QoroQuantum/maestro.git
          git -C "$MAESTRO_DIR" fetch --depth 1 origin "$MAESTRO_REF"
          git -C "$MAESTRO_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$MAESTRO_DIR" rev-parse HEAD)" = "$MAESTRO_REF"

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build ccache libclang-dev libopenblas-dev

      # Installed straight into /usr/local (a standard search path) rather
      # than a self-contained prefix, so no extra linker configuration is
      # needed for Boost's shared libraries at test-run time.
      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/include/boost
            /usr/local/lib/libboost*
          key: ${{ runner.os }}-boost-${{ env.BOOST_VERSION }}

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -L https://archives.boost.io/release/${{ env.BOOST_VERSION }}/source/${{ steps.paths.outputs.boost_dir }}.tar.gz --output boost.tgz
          tar -xzf boost.tgz
          cd ${{ steps.paths.outputs.boost_dir }}
          ./bootstrap.sh --prefix=/usr/local
          sudo ./b2 -j$(nproc) --with-program_options --with-json --with-container --with-serialization install

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-maestro-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-maestro-${{ runner.os }}-

      # Let Maestro fetch its pinned Aer revision, including its threading fixes.
      # A permanently cached external checkout would override that dependency pin.
      # Aer remains enabled for the legacy backend-selection assertions.
      - name: Configure Maestro
        working-directory: ${{ steps.paths.outputs.maestro_dir }}
        env:
          BOOST_ROOT: /usr/local
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DMAESTRO_BUILD_REQUEST_TESTS=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      # Qiskit Aer's heavily templated C++ can use several GB per
      # translation unit, so -j$(nproc) risks OOMing on standard GitHub-hosted
      # runners; capping at -j1 trades build time for staying within memory.
      - name: Build Maestro
        working-directory: ${{ steps.paths.outputs.maestro_dir }}
        run: cmake --build build -j1

      # libmaestro.so installs directly to /usr/local (not /usr/local/lib),
      # which ubuntu-latest runners don't scan by default, so the dynamic
      # linker needs to be told about it explicitly.
      - name: Install Maestro
        working-directory: ${{ steps.paths.outputs.maestro_dir }}
        run: |
          sudo cmake --install build
          echo "/usr/local" | sudo tee /etc/ld.so.conf.d/maestro.conf
          sudo ldconfig

      # These suites cover CPU tensor queries and current/older GPU plugin
      # dispatch using mocks. Real GPU/MPI hardware suites remain opt-in.
      - name: Test Maestro native requests and backend integration
        working-directory: ${{ steps.paths.outputs.maestro_dir }}
        run: >-
          ctest --test-dir build --output-on-failure --timeout 180
          -R '^(maestro_request_.*|expectation_batches|tensor_dispatch_(current|legacy)|fusion_interface_wrappers|network_jobs)$'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          MAESTRO_DIR: ${{ steps.paths.outputs.maestro_dir }}
        run: cargo build --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        env:
          MAESTRO_DIR: ${{ steps.paths.outputs.maestro_dir }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        timeout-minutes: 10
        env:
          MAESTRO_DIR: ${{ steps.paths.outputs.maestro_dir }}
        run: cargo test --verbose

      - name: Check out QRMI
        run: |
          QRMI_DIR="$RUNNER_TEMP/qrmi"
          git init -q "$QRMI_DIR"
          git -C "$QRMI_DIR" remote add origin https://github.com/QoroQuantum/qrmi.git
          git -C "$QRMI_DIR" fetch --depth 1 origin "$QRMI_REF"
          git -C "$QRMI_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$QRMI_DIR" rev-parse HEAD)" = "$QRMI_REF"
          echo "QRMI_DIR=$QRMI_DIR" >> "$GITHUB_ENV"

      - name: Test QRMI's Maestro client
        run: cargo test --locked --manifest-path "$QRMI_DIR/Cargo.toml" -p maestro-local-api

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A dev-profile extension builds faster; these tests are not timing-bound.
      - name: Install QRMI
        env:
          MATURIN_PEP517_ARGS: --profile dev
        run: pip install -e "$QRMI_DIR" pytest

      # Fails, rather than skips, if either native binary is missing.
      - name: Test QRMI through this server and Maestro
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/qrmi
        env:
          QRMI_REQUIRE_MAESTRO_NATIVE: "1"
          QRMI_TEST_MAESTRO_SERVER: ${{ github.workspace }}/target/debug/maestro-local-server
          QRMI_TEST_MAESTRO_REQUEST: ${{ steps.paths.outputs.maestro_dir }}/build/bin/maestro-request
        run: pytest -rs python/tests/unit/quantum_resource/test_maestro_native_integration.py
